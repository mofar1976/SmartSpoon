name: smartspoon
services:
  frontend:
    build: ../Frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  backend:
    build: .
    environment:
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JWT_SECRET: ${JWT_SECRET:?Bitte JWT_SECRET in Backend/.env setzen}
      MONGODB_URI: mongodb://mongodb:27017/kochfaul
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb_data:
    # Existing physical volume retained across the SmartSpoon rename.
    name: ${MONGODB_VOLUME_NAME:-kochfaul_mongodb_data}
