name: smartspoon
services:
  frontend:
    build: ../Frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  backend:
    build: .
    environment:
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JWT_SECRET: ${JWT_SECRET:?Bitte JWT_SECRET in Backend/.env setzen}
      MONGODB_URI: mongodb://mongodb:27017/kochfaul
      INGREDIENT_RECOGNITION_URL: http://ingredient-recognition:8090
      INGREDIENT_RECOGNITION_TOKEN: ${INGREDIENT_RECOGNITION_TOKEN:-}
      INGREDIENT_RECOGNITION_TIMEOUT_MS: 190000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  ingredient-recognition:
    profiles: [vision]
    build:
      context: .
      dockerfile: ingredient-recognition/Dockerfile
    environment:
      PORT: 8090
      INGREDIENT_RECOGNITION_TOKEN: ${INGREDIENT_RECOGNITION_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:4b-instruct}
      VISION_TIMEOUT_SECONDS: 180
    ports:
      - "127.0.0.1:${INGREDIENT_RECOGNITION_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 10s
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb_data:
    # Existing physical volume retained across the SmartSpoon rename.
    name: ${MONGODB_VOLUME_NAME:-kochfaul_mongodb_data}
