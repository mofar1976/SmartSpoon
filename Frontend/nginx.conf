# Docker DNS keeps the proxy working when the backend container is recreated.
upstream kochfaul_api {
    zone kochfaul_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:3000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Preserve /api paths, response status codes and Authorization headers.
    location ~ ^/api(?:/|$) {
        proxy_pass http://kochfaul_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Two backend Gemini calls may each take 30 seconds.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Only fingerprinted Angular files are cached long term.
    location ~ ^/(?:main|chunk|styles)-[A-Za-z0-9_-]+\.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.(?:js|css|svg|png|ico|woff2?|json)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
