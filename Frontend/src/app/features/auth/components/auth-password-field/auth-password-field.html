<div class="field">
  <label class="field-label" for="auth-password">{{ 'auth.password' | translate }}</label>
  <input
    id="auth-password"
    class="field-control pr-28"
    [attr.aria-invalid]="control().touched && control().invalid"
    [attr.aria-describedby]="
      (register() ? 'auth-password-hint' : '') +
      (control().touched && control().invalid ? ' auth-password-error' : '')
    "
    [formControl]="control()"
    [type]="showPassword() ? 'text' : 'password'"
    [autocomplete]="register() ? 'new-password' : 'current-password'"
    minlength="8"
    maxlength="128"
    [readOnly]="busy()"
    required
  />
  <button
    class="btn btn-text absolute top-1.25 right-1 min-w-17.5 px-2 text-label"
    type="button"
    (click)="showPassword.set(!showPassword())"
    [attr.aria-pressed]="showPassword()"
    [attr.aria-label]="
      (showPassword() ? 'auth.hidePasswordLabel' : 'auth.showPasswordLabel') | translate
    "
  >
    {{ showPassword() ? i18n.t('auth.hidePassword') : i18n.t('auth.showPassword') }}
  </button>
  @if (register()) {
    <p class="field-hint" id="auth-password-hint">{{ 'auth.passwordHint' | translate }}</p>
  }
  @if (control().touched && control().invalid) {
    <p class="field-error" id="auth-password-error">
      {{ 'auth.passwordInvalid' | translate }}
    </p>
  }
</div>
